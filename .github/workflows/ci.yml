name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            extras: core,csf,odometry,ml,dev
          - os: ubuntu-latest
            python-version: "3.11"
            extras: core,csf,odometry,ml,dev
          - os: windows-latest
            python-version: "3.11"
            extras: core,odometry,ml,dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Open3D runtime and compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libusb-1.0-0 libgl1 libegl1 libgomp1 libx11-6
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Install the release wheel
        if: runner.os == 'Linux'
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/canopy-wheel" .
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/canopy-wheel/*.whl
      - name: Run the installed wheel outside the checkout
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: canopy-odometry --synthetic 0 --out canopy-wheel-smoke
