name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Open3D (simulated LiDAR) needs these system libraries on Ubuntu.
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0 libgl1 libgomp1
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[core,dev]"
      - run: ruff check .
      - run: pytest -q
