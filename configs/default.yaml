# Shared defaults for later phases. Keep numbers here so experiments are reproducible.
voxel_size_m: 0.10
simulation:
  plot_size_m: 50.0
  tree_count: 40
  ground_slope_deg: 15.0
  stem_dbh_min_m: 0.10
  stem_dbh_max_m: 0.60
  shrub_min_height_m: 0.5
  shrub_max_height_m: 4.0
sensor:
  beam_count: 16
  vertical_fov_deg: 30.0
  max_range_m: 30.0
  range_noise_std_m: 0.01
ground:
  grid_size_m: 1.0
  lowest_quantile: 0.10
  ransac_distance_m: 0.15
  ransac_iterations: 100
dbh:
  slice_min_m: 1.2
  slice_max_m: 1.4
  min_points: 20
  min_radius_m: 0.05
  max_radius_m: 0.30
  max_fit_residual_m: 0.05
ladder_fuel:
  bands_m:
    - [1.0, 4.0]
    - [1.0, 8.0]
  grid_size_m: 1.0
  occupancy_voxel_m: 0.10
  crown_gap_min_m: 0.50
density:
  bands_m:
    - [0.0, 1.0]
    - [1.0, 4.0]
    - [4.0, 8.0]
    - [8.0, .inf]
  grid_size_m: 1.0
navigation:
  sector_count: 9
  forward_radius_m: 8.0
  safety_distance_m: 1.5
  rover_height_m: 2.0
  rover_radius_m: 0.35
  step_size_m: 0.25
  max_steps: 1000
  hysteresis_steps: 3
  goal_heading_weight: 0.25
