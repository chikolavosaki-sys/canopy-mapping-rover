# Every tunable number in the project. Code reads defaults from here through
# canopy.config, so change a value here rather than inside a function.
# Units are in the key name: _m metres, _deg degrees, _hz hertz.

voxel_size_m: 0.10          # map downsampling and density occupancy voxels

simulation:
  plot_size_m: 50.0
  tree_count: 40
  points_per_tree: 180
  ground:
    spacing_m: 0.5             # ground sample and ground-mesh grid spacing
    max_slope_deg: 15.0        # each forest gets a random tilt in [0, max]
    wave_count: 3              # smooth bumps on top of the tilt
    wave_amplitude_m: 0.15     # total bump amplitude (kept below the rover's 0.3 m clearance)
    wavelength_range_m: [6.0, 20.0]
    # Forest-floor roughness (litter, roots). Smooth ground makes LiDAR rings look the same
    # everywhere, so ICP "thinks" it is not moving (ATE 0.74 m over 6 m at 0 cm, 0.26 m at 5 cm).
    roughness_std_m: 0.05
  trees:
    edge_margin_m: 2.0
    dbh_range_m: [0.10, 0.60]
    height_range_m: [8.0, 20.0]
    stem_height_fraction: 0.72   # stem points cover this fraction of tree height
    bark_noise_std_m: 0.01
    crown_centre_fraction: 0.78
    crown_spread_fraction: [0.20, 0.20, 0.14]   # x, y, z spread as a fraction of height
    crown_min_points: 30
    crown_points_divisor: 3      # crown points = points_per_tree / divisor
  shrubs:
    area_per_shrub_m: 15.0       # one shrub per this many metres of plot side
    min_count: 2
    edge_margin_m: 1.0
    base_height_m: 0.5
    footprint_range_m: [1.0, 3.0]
    height_range_m: [0.5, 3.5]   # so shrubs reach 1.0-4.0 m
    points_per_shrub: 70
  traversal:                   # gentle S-shaped path across the plot middle
    # KISS-ICP lost track above ~1 m per frame in our tests; 0.4 m at 5 Hz = 2 m/s.
    step_m: 0.4
    edge_margin_m: 5.0
    sway_amplitude_m: 2.0
    sway_wavelength_m: 4.0
    sensor_height_m: 0.6
  mesh:                        # geometry the simulated LiDAR rays hit (canopy.simulation.lidar)
    cylinder_resolution: 24    # sides per trunk cylinder
    sphere_resolution: 4       # detail of rock and foliage-clump spheres
    trunk_sink_m: 0.3          # trunks start this far below ground so slopes leave no gap
    crown_clump_radius_m: 0.20 # each crown point becomes a leaf clump this size (porous crowns)
    shrub_clump_radius_m: 0.10
  rocks:                       # solid boulders: points lie on a hemisphere of this radius
    count: 3
    points_per_rock: 120
    radius_range_m: [0.3, 0.7]
    edge_margin_m: 1.0

sensor:                       # roughly a Velodyne VLP-16
  beam_count: 16
  vertical_fov_deg: 30.0
  horizontal_samples: 900      # 0.4 deg azimuth steps
  max_range_m: 30.0
  range_noise_std_m: 0.01      # Gaussian noise along each ray

ground:
  grid_size_m: 1.0
  lowest_quantile: 0.10
  ransac_distance_m: 0.15      # used by the RANSAC fallback (step 5)
  ransac_iterations: 100

dbh:
  slice_min_m: 1.2
  slice_max_m: 1.4
  cluster_radius_m: 0.8
  min_points: 20
  min_radius_m: 0.025
  max_radius_m: 0.30
  max_fit_residual_m: 0.05

ladder_fuel:
  bands_m:
    - [1.0, 4.0]
    - [1.0, 8.0]
  band_weights: [0.7, 0.3]
  grid_size_m: 1.0
  occupancy_voxel_m: 0.10
  crown_gap_min_m: 0.50        # used by the vertical-gap feature (step 5)

density:
  bands_m:
    - [0.0, 1.0]
    - [1.0, 4.0]
    - [4.0, 8.0]
    - [8.0, .inf]
  grid_size_m: 1.0

odometry:                    # passed to KISS-ICP's own KISSConfig
  voxel_size_m: 0.10
  min_range_m: 0.5           # drop returns from the rover itself
  max_range_m: 100.0
  deskew: false              # synthetic scans and WSF-19 have no per-point time
  max_points_per_voxel: 20
  frame_period_s: 0.2        # 5 Hz, used for TUM timestamps when frames have none
  test_ate_max_m: 0.5        # loose ATE bound for the synthetic-traversal test

navigation:
  sector_count: 9
  sector_fov_deg: 180.0        # sectors span this field of view in front of the rover
  forward_radius_m: 8.0
  obstacle_min_height_m: 0.30  # rover ground clearance: anything lower passes under the chassis
  rover_height_m: 2.0
  rover_radius_m: 0.35
  sensor_height_m: 0.6
  step_size_m: 0.25
  turn_angle_deg: 15.0         # in-place rotation per step while avoiding
  forward_turn_max_deg: 15.0   # most the rover steers towards the goal per step while driving
  max_steps: 1000
  safety_distance_m: 1.5       # start avoiding when the corridor ahead is closer than this
  clear_margin_m: 0.5          # resume driving only when clear by safety + this (hysteresis)
  corridor_margin_m: 0.15      # corridor half-width = rover radius + this
  stop_distance_fraction: 0.5  # STOP when every sector is closer than this x safety distance
  goal_heading_weight: 0.25    # side bonus (x forward radius) for turning towards the goal
  goal_tolerance_m: 0.35
  memory_scans: 8              # remember obstacles from the last 8 scans (covers the blind zone)
  terrain:                     # rover's own ground estimate from each scan
    cell_size_m: 1.0           # lowest point per cell = ground candidate
    ransac_distance_m: 0.15    # candidates this close to the plane count as ground
    ransac_iterations: 60
  eval:
    plot_size_m: 30.0
    tree_counts: [10, 20, 40, 80]  # forest densities: about 110-890 trees per hectare
    seeds_per_density: 20      # 4 x 20 = 80 runs (target: >= 50)
    # Seeds 0-19 were used to tune the controller and 1000-1019 to diagnose the blind
    # zone, so reported runs start here, on seeds nobody has looked at.
    reported_seed_offset: 2000
    start_goal_margin_m: 1.0   # start/goal sit this far inside the plot edges
    start_clearance_m: 1.0     # start/goal must be this far from any trunk or rock
    start_search_step_m: 0.5   # shift start/goal sideways by this until clear

evaluation:
  tree_match_gate_m: 0.5

demo:
  plot_size_m: 20.0
  tree_count: 6
  points_per_tree: 1000
  stem_cluster_radius_m: 0.45  # tighter than dbh.cluster_radius_m for the small demo plot
  stem_min_points: 10
